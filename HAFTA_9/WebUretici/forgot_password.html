<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | NeonAuth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080711;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 243, 255, 0.2) 0%, transparent 45%);
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 14, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 30px rgba(138, 43, 226, 0.15);
            position: relative;
            z-index: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f3ff 0%, #b829ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .auth-header p {
            color: #a0a0c0;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #d1d1ed;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 7, 24, 0.6);
            border: 1.5px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(15, 10, 35, 0.8);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8a2be2 0%, #00f3ff 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), 0 0 15px rgba(138, 43, 226, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .auth-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.9rem;
            color: #a0a0c0;
        }

        .auth-footer a {
            color: #00f3ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .auth-footer a:hover {
            color: #b829ff;
            text-shadow: 0 0 8px rgba(184, 41, 255, 0.6);
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .alert-box.error {
            background: rgba(255, 49, 49, 0.15);
            border: 1px solid rgba(255, 49, 49, 0.5);
            color: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 49, 49, 0.2);
        }

        .alert-box.success {
            background: rgba(0, 255, 157, 0.15);
            border: 1px solid rgba(0, 255, 157, 0.5);
            color: #00ff9d;
            box-shadow: 0 0 10px rgba(0, 255, 157, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Şifremi Unuttum</h1>
            <p>E-posta adresinizi girin, sıfırlama bağlantısını gönderelim.</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="forgotPasswordForm" novalidate>
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" class="form-control" placeholder="ornek@domain.com" required>
            </div>

            <button type="submit" class="btn-submit">Sıfırlama Bağlantısı Gönder</button>
        </form>

        <div class="auth-footer">
            <a href="index.html">← Giriş sayfasına dön</a>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotPasswordForm');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert-box ${type}`;
            alertBox.style.display = 'block';
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = document.getElementById('email').value.trim();

            if (!email) {
                showAlert('Lütfen e-posta adresinizi girin.', 'error');
                return;
            }

            if (!validateEmail(email)) {
                showAlert('Lütfen geçerli bir e-posta adresi girin.', 'error');
                return;
            }

            showAlert('Sıfırlama bağlantısı e-posta adresinize gönderildi!', 'success');
            setTimeout(() => {
                forgotForm.reset();
            }, 2500);
        });
    </script>
</body>
</html>
